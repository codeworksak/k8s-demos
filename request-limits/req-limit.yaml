apiVersion: v1
kind: Pod
metadata:
  name: req-limit-pod
spec:
  containers:
    - name: req-limit-demo
      image: polinux/stress
      resources:
        requests:
          memory: "100Mi"
        limits:
          memory: "200Mi"
      command: ["stress"]
      args: ["--vm","1","--vm-bytes","190M","--vm-hang","1"]    
